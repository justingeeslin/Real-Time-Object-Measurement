[project]
name = "ObjectMeasurer"     # pip install BodySegmentPainter
version = "0.1.1"
description = "Segment and color OpenCV contours"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "opencv-python>=4.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]